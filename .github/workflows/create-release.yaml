name: "create release"

on:
  workflow_run:
    workflows: ["godot-ci export"]
    types:
      - completed

permissions:
  contents: read
concurrency:
  group: create-release
  cancel-in-progress: false
jobs:
  create:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Compute next version
        run: |
          git fetch --tags --depth=1
          LATEST=$(git tag --list "0.0.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            PATCH=1
          else
            PATCH=$(echo "$LATEST" | awk -F. '{print $3+1}')
          fi

          echo "TAG=0.0.$PATCH" >> $GITHUB_ENV

      - name: Download godot-ci artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Create prerelease with assets
        run: |
          shopt -s globstar
          gh release create "$TAG" artifacts/**/* --title "$TAG" --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report failure
        if: failure()
        run: echo "### Release failed for tag \`$TAG\`" >> $GITHUB_STEP_SUMMARY
